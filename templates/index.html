<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<title>Gestor de Tareas</title>
		<style>
			body {
				font-family: sans-serif;
				max-width: 600px;
				margin: 40px auto;
			}
			.task {
				border: 1px solid #ccc;
				padding: 10px;
				margin-bottom: 8px;
				border-radius: 4px;
			}
			.tag-badge {
				background: #007bff;
				color: white;
				padding: 2px 6px;
				border-radius: 3px;
				font-size: 12px;
			}
		</style>
	</head>
	<body>
		<h1>Tablero de Tareas</h1>
		<div id="tasks-container"></div>
		<script>
			fetch("/api/tasks")
				.then((res) => res.json())
				.then((data) => {
					const container = document.getElementById("tasks-container");
					container.innerHTML = data
						.map((t) => `<div class="task"><strong>${t.title}</strong></div>`)
						.join("");
				});
		</script>
	</body>
</html>
